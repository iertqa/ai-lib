<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERTQA Version Selector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-primary: #ffffff;
            --text-secondary: #98989f;
            --accent-gold: #e2b95b;
            --bg-dark: #050508;
            --glass-bg: rgba(20, 20, 25, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(40, 90, 200, 0.45) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(160, 40, 120, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 20% 90%, rgba(215, 167, 74, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(30, 150, 140, 0.3) 0%, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 24px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 48px 32px;
            box-shadow:
                0 32px 64px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 36px;
            font-weight: 500;
        }

        .version-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 105px;
            padding: 20px;

            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 20px;

            color: var(--text-primary);
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;

            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .btn:nth-child(1):hover {
            background: rgba(100, 150, 255, 0.12);
            border-color: rgba(100, 150, 255, 0.4);
            box-shadow: 0 12px 24px rgba(40, 90, 200, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px) scale(1.02);
        }

        .btn:nth-child(2):hover {
            background: rgba(160, 40, 120, 0.12);
            border-color: rgba(160, 40, 120, 0.4);
            box-shadow: 0 12px 24px rgba(160, 40, 120, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px) scale(1.02);
        }

        .btn:nth-child(3):hover {
            background: rgba(215, 167, 74, 0.12);
            border-color: rgba(215, 167, 74, 0.5);
            box-shadow: 0 12px 24px rgba(215, 167, 74, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px) scale(1.02);
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .label-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>ERTQA Ai Library</h1>
        <p class="subtitle">Select an environment to proceed</p>

        <div class="version-list">
            <a href="https://v1-ertqa.vercel.app/login" class="btn" target="_blank" rel="noopener noreferrer">
                V1 <span class="label-tag">(PRE-DESIGN)</span>
            </a>
            <a href="https://v2-ertqa.vercel.app/login" class="btn" target="_blank" rel="noopener noreferrer">
                V2 <span class="label-tag">(LAST PUSHED)</span>
            </a>
            <a href="https://v3-ertqa.vercel.app/login" class="btn" target="_blank" rel="noopener noreferrer">
                V3 <span class="label-tag">(CURRENT APP)</span>
            </a>
        </div>
    </div>

</body>
</html>
