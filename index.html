<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERTQA Version Selector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-gold: #d7a74a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            /* Adding blurred background elements to make the glass effect pop */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(215, 167, 74, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(50, 70, 150, 0.2) 0%, transparent 40%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .glass-card {
            /* The Glass Effect */
            background: rgba(25, 25, 30, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1); /* Light reflection on top edge */
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        .version-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Uniform Glass Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            
            /* Button Glass Effect */
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            
            color: var(--text-primary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(215, 167, 74, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Adds a subtle shine effect on hover */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.05),
                transparent
            );
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .label-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
            margin-left: 8px;
            font-weight: 400;
        }

    </style>
</head>
<body>

    <div class="glass-card">
        <h1>ERTQA Ai Library</h1>
        <p class="subtitle">Select an environment to proceed</p>
        
        <div class="version-list">
            <a href="https://v1-ertqa.vercel.app/login" class="btn">
                V1 <span class="label-tag">(PRE-DESIGN)</span>
            </a>
            <a href="https://v2-ertqa.vercel.app/login" class="btn">
                V2 <span class="label-tag">(LAST PUSHED)</span>
            </a>
            <a href="https://v3-ertqa.vercel.app/login" class="btn">
                V3 <span class="label-tag">(In Dev)</span>
            </a>
        </div>
    </div>


</body></html>
